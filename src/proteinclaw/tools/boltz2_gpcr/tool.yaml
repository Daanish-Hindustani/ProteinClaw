name: structure.boltz2_gpcr
display_name: State-conditioned Boltz-2 GPCR complex prediction
category: structure
description: |
  Predict a nanobody-GPCR complex with Boltz-2 while forcing the verified
  receptor template/state from a schema-v3 GPCR manifest and conditioning on
  the experimentally grounded epitope. The binder pose is not templated.
parameters:
  type: object
  additionalProperties: false
  properties:
    target_manifest_path:
      type: string
      minLength: 1
    binder_sequence:
      type: string
      minLength: 80
      maxLength: 180
      pattern: "^[ACDEFGHIKLMNPQRSTVWY]+$"
    use_msa_server:
      type: boolean
      default: true
    diffusion_samples:
      type: integer
      minimum: 1
      maximum: 5
      default: 5
    recycling_steps:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
    force_template:
      type: boolean
      default: true
    template_threshold:
      type: number
      minimum: 0.5
      maximum: 5.0
      default: 1.5
    force_pocket:
      type: boolean
      default: false
    use_potentials:
      type: boolean
      default: true
    session_id:
      type: string
    step:
      type: integer
      minimum: 0
      default: 0
  required: [target_manifest_path, binder_sequence]
compute:
  requires_gpu: true
  min_vram_gb: 24
  gpu_profile: large
execution:
  docker_image: proteinclaw/boltz2-gpcr:2.2.1
  timeout_s: 7200
usage_guide: |
  Calibrate on a solved/experimentally validated nanobody first. Use the exact
  same receptor manifest, template threshold, pocket conditioning, potentials,
  MSA mode, and sample count for candidates and matched controls. A candidate
  must separate from the control and reproduce the intended fixed-structure
  epitope; never interpret this tool as experimental proof of binding.
