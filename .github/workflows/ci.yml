name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + type + test (mocks only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --python 3.11 --extra dev

      - name: Ruff (lint)
        run: uv run --python 3.11 ruff check src tests

      - name: Ruff (format check)
        run: uv run --python 3.11 ruff format --check src tests

      - name: Mypy (strict)
        run: uv run --python 3.11 mypy

      - name: Pytest (mocks only, coverage gate)
        run: uv run --python 3.11 pytest
