# Evaluator default thresholds.
# Used when a SuccessCriterion does not override per-metric thresholds.
# Comparison values: "gte" (observed >= threshold), "lte", "eq".
defaults:
  plddt:
    threshold: 0.80
    comparison: gte
  ptm:
    threshold: 0.70
    comparison: gte
  rmsd:
    threshold: 3.0
    comparison: lte
  clash_score:
    threshold: 5.0
    comparison: lte
  interface_sasa:
    threshold: 600.0
    comparison: gte
  novelty:
    threshold: 0.50
    comparison: gte
  constraint_satisfaction:
    threshold: 1.0
    comparison: gte

# Verdict thresholds tuned on the fraction of SuccessCriteria that passed.
# 1.0 → STOP_SUCCESS; >= retry_floor → RETRY; below → BRANCH.
verdict:
  retry_floor: 0.50
