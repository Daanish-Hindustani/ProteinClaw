id: binder_real_smoke
description: Small real-backend binder-design smoke suite with valid RCSB targets.
tasks:
  - id: binder_2lzm_t4_lysozyme
    prompt: Design a 70-100 residue binder for PDB 2LZM chain A. Use RFdiffusion for backbone generation, ProteinMPNN for sequence design, and fold the top designed sequence.
    fanout: 1
    iterations: 1
    tags: [binder, real, smoke, lysozyme]
  - id: binder_1ubq_ubiquitin
    prompt: Design a 60-90 residue binder for PDB 1UBQ chain A. Use the ubiquitin hydrophobic patch as the intended binding surface when choosing hotspots, then run RFdiffusion, ProteinMPNN, and structure prediction.
    fanout: 1
    iterations: 1
    tags: [binder, real, smoke, ubiquitin]
