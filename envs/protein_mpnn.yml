# Conda env file for the ProteinMPNN local backend.
#
# ProteinMPNN is NOT a pip-installable Python package — the repo
# (https://github.com/dauparas/ProteinMPNN) ships only scripts and weights,
# with no setup.py / pyproject.toml. `pip install git+…` against it fails
# with "does not appear to be a Python project". The setup script clones
# the repo separately to $PROTEINMPNN_PATH and runs `protein_mpnn_run.py`
# with this env's interpreter; this file only needs to provide the runtime
# deps that script imports.
#
# Set PROTEINCLAW_PROTEIN_MPNN_BACKEND=local and PROTEINMPNN_PATH to the
# clone directory.
name: proteinclaw-protein-mpnn
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.0
  - numpy
