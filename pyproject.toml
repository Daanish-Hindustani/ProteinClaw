[project]
name = "proteinclaw"
version = "0.0.1"
description = "Agentic protein-design workflow with branching sub-agents, evaluation, memory, and self-evolution."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daanish Hindustani" }]
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1",
    "litellm>=1.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
proteinclaw = "proteinclaw.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteinclaw"]

[tool.hatch.build.targets.editable]
# Redirect mode adds a .pth entry pointing at src/ so new submodules created
# during development are discovered without `uv sync --reinstall-package`.
packages = ["src/proteinclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=proteinclaw",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-m", "not expensive",
]
markers = [
    "expensive: tests that hit real protein-design tools (RFdiffusion, AlphaFold, etc); excluded from default CI",
    "integration: full pipeline integration tests using mocks",
]

[tool.coverage.run]
source = ["src/proteinclaw"]
branch = true
omit = [
    "src/proteinclaw/cli.py",
    # _real backends use real GPU/network. The parser + arg-construction
    # paths are tested in tests/tools/_real/; the rest of these modules
    # only runs against live infra (gated behind @pytest.mark.expensive).
    "src/proteinclaw/tools/protein/_real/_subprocess.py",
    "src/proteinclaw/tools/protein/_real/foldseek_rest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async pitfalls
    "D",             # pydocstyle (we mandate docstrings)
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # don't require docstrings on tests

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/proteinclaw"]

[[tool.mypy.overrides]]
module = ["litellm.*"]
ignore_missing_imports = true
