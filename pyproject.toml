[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "proteinclaw"
version = "0.1.0"
description = "MCP/plugin tools for protein binder design workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ProteinClaw contributors" }]
keywords = ["protein", "binder-design", "mcp", "plugin", "rfdiffusion", "alphafold", "proteinmpnn", "esmfold"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "biopython>=1.83,<2.0",
    "numpy>=1.26,<3.0",
    "requests>=2.31,<3.0",
    "mcp>=1.0,<2.0",
    "prodigy-prot>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "responses>=0.25,<1.0",
    "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://github.com/Daanish-Hindustani/ProteinClaw"


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/proteinclaw"]

[tool.hatch.build.targets.sdist]
include = [
    ".codex-plugin/plugin.json",
    ".mcp.json",
    "skills",
    "src/proteinclaw",
    "docs",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "GOVERNANCE.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not gpu and not live'"
markers = [
    "gpu: requires NVIDIA GPU and Docker (skipped by default; opt-in with `pytest -m gpu`)",
    "live: hits real external APIs (skipped by default; opt-in with `pytest -m live`)",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["src/proteinclaw"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "runs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
